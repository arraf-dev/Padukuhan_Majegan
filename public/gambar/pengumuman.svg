<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Papan pengumuman padukuhan">
  <title>Papan pengumuman padukuhan</title>

  <rect width="600" height="600" fill="#f5ebd0"/>

  <!-- latar -->
  <path d="M0 292 Q 160 250 320 284 Q 470 316 600 278 L600 600 L0 600 Z" fill="#e6ede4"/>
  <g fill="#2a5b3c" opacity=".2">
    <circle cx="82" cy="264" r="40"/>
    <circle cx="524" cy="258" r="34"/>
  </g>
  <rect y="470" width="600" height="130" fill="#ebe6d8"/>
  <path d="M0 470 h600 v9 H0 Z" fill="#0d3825" opacity=".09"/>

  <!-- tiang papan -->
  <rect x="146" y="330" width="16" height="150" rx="5" fill="#6b5432"/>
  <rect x="438" y="330" width="16" height="150" rx="5" fill="#6b5432"/>

  <!-- atap papan -->
  <path d="M300 92 L500 172 L100 172 Z" fill="#0d3825"/>
  <path d="M300 92 L500 172 L300 172 Z" fill="#ffffff" opacity=".07"/>
  <rect x="92" y="168" width="416" height="13" rx="5" fill="#d6b45c"/>

  <!-- badan papan -->
  <rect x="120" y="184" width="360" height="164" rx="9" fill="#f7f3e8" stroke="#cbc3a8" stroke-width="3"/>

  <!-- kertas pengumuman -->
  <g>
    <rect x="146" y="208" width="140" height="112" rx="5" fill="#ffffff" stroke="#e3dcc7" stroke-width="2"/>
    <rect x="160" y="224" width="96" height="9" rx="4.5" fill="#0d3825" opacity=".75"/>
    <g fill="#8a9a8c" opacity=".7">
      <rect x="160" y="246" width="112" height="6" rx="3"/>
      <rect x="160" y="260" width="98" height="6" rx="3"/>
      <rect x="160" y="274" width="106" height="6" rx="3"/>
      <rect x="160" y="288" width="72" height="6" rx="3"/>
    </g>
  </g>
  <g>
    <rect x="306" y="208" width="140" height="112" rx="5" fill="#f5ebd0" stroke="#e8d9ae" stroke-width="2"/>
    <rect x="320" y="224" width="80" height="9" rx="4.5" fill="#8a6d2b"/>
    <g fill="#a9b4a9" opacity=".8">
      <rect x="320" y="246" width="112" height="6" rx="3"/>
      <rect x="320" y="260" width="90" height="6" rx="3"/>
      <rect x="320" y="274" width="104" height="6" rx="3"/>
    </g>
    <rect x="320" y="292" width="56" height="18" rx="9" fill="#b0532e" opacity=".85"/>
  </g>

  <!-- paku payung -->
  <g fill="#b0532e">
    <circle cx="152" cy="214" r="5"/>
    <circle cx="280" cy="214" r="5"/>
    <circle cx="312" cy="214" r="5"/>
    <circle cx="440" cy="214" r="5"/>
  </g>

  <!-- warga membaca -->
  <g>
    <circle cx="300" cy="394" r="22" fill="#c99a6b"/>
    <path d="M278 388 q22 -21 44 0 q-2 -17 -22 -17 q-20 0 -22 17 Z" fill="#213228"/>
    <rect x="280" y="420" width="40" height="56" rx="12" fill="#356b48"/>
    <rect x="266" y="430" width="12" height="36" rx="6" fill="#c99a6b"/>
    <rect x="322" y="430" width="12" height="36" rx="6" fill="#c99a6b"/>
  </g>

  <text x="586" y="586" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#0d3825" opacity=".33">ilustrasi</text>
</svg>
