<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Kirab budaya Merti Dusun dengan gunungan hasil bumi">
  <title>Merti Dusun — kirab gunungan</title>

  <!-- langit senja -->
  <rect width="600" height="600" fill="#f5ebd0"/>
  <rect width="600" height="250" fill="#f0dfb8"/>
  <circle cx="300" cy="196" r="66" fill="#d6b45c" opacity=".42"/>

  <!-- bukit -->
  <path d="M0 254 Q 160 208 320 244 Q 470 278 600 240 L600 600 L0 600 Z" fill="#e6ede4"/>
  <g fill="#2a5b3c" opacity=".22">
    <circle cx="70" cy="234" r="38"/>
    <circle cx="540" cy="228" r="34"/>
  </g>

  <!-- jalan kirab -->
  <rect y="452" width="600" height="148" fill="#ebe6d8"/>
  <path d="M0 452 h600 v9 H0 Z" fill="#0d3825" opacity=".09"/>

  <!-- umbul-umbul -->
  <g>
    <rect x="52" y="256" width="5" height="200" rx="2" fill="#8a6d2b"/>
    <path d="M57 262 q26 16 0 32 q26 16 0 32 q26 16 0 32" fill="none" stroke="#b0532e" stroke-width="12" stroke-linecap="round"/>
    <rect x="544" y="256" width="5" height="200" rx="2" fill="#8a6d2b"/>
    <path d="M544 262 q-26 16 0 32 q-26 16 0 32 q-26 16 0 32" fill="none" stroke="#2a5b3c" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- gunungan hasil bumi -->
  <g>
    <path d="M300 168 L392 420 L208 420 Z" fill="#2a5b3c"/>
    <path d="M300 168 L392 420 L300 420 Z" fill="#ffffff" opacity=".08"/>
    <!-- hasil bumi -->
    <g>
      <circle cx="300" cy="228" r="13" fill="#d6b45c"/>
      <circle cx="278" cy="266" r="12" fill="#b0532e"/>
      <circle cx="322" cy="266" r="12" fill="#e08b3e"/>
      <circle cx="258" cy="308" r="13" fill="#d6b45c"/>
      <circle cx="300" cy="304" r="14" fill="#7fa845"/>
      <circle cx="342" cy="308" r="13" fill="#b0532e"/>
      <circle cx="240" cy="350" r="12" fill="#e08b3e"/>
      <circle cx="282" cy="348" r="13" fill="#d6b45c"/>
      <circle cx="322" cy="348" r="13" fill="#7fa845"/>
      <circle cx="362" cy="350" r="12" fill="#d6b45c"/>
      <circle cx="228" cy="392" r="12" fill="#7fa845"/>
      <circle cx="268" cy="392" r="13" fill="#b0532e"/>
      <circle cx="310" cy="392" r="13" fill="#e08b3e"/>
      <circle cx="352" cy="392" r="12" fill="#d6b45c"/>
    </g>
    <!-- mustaka gunungan -->
    <path d="M300 140 L312 168 L288 168 Z" fill="#d6b45c"/>
    <circle cx="300" cy="136" r="8" fill="#d6b45c"/>
    <!-- tandu -->
    <rect x="196" y="418" width="208" height="14" rx="6" fill="#8a6d2b"/>
    <rect x="168" y="424" width="264" height="8" rx="4" fill="#6b5432"/>
  </g>

  <!-- pengusung kiri -->
  <g>
    <circle cx="196" cy="358" r="19" fill="#c99a6b"/>
    <path d="M177 352 q19 -18 38 0 q-2 -14 -19 -14 q-17 0 -19 14 Z" fill="#0d3825"/>
    <rect x="180" y="378" width="32" height="52" rx="10" fill="#b0532e"/>
    <rect x="184" y="428" width="11" height="46" rx="5.5" fill="#3f4a52"/>
    <rect x="199" y="428" width="11" height="46" rx="5.5" fill="#3f4a52"/>
    <rect x="206" y="382" width="10" height="42" rx="5" fill="#c99a6b" transform="rotate(-24 206 382)"/>
  </g>
  <!-- pengusung kanan -->
  <g>
    <circle cx="404" cy="358" r="19" fill="#a97c4f"/>
    <path d="M385 352 q19 -18 38 0 q-2 -14 -19 -14 q-17 0 -19 14 Z" fill="#213228"/>
    <rect x="388" y="378" width="32" height="52" rx="10" fill="#2a5b3c"/>
    <rect x="392" y="428" width="11" height="46" rx="5.5" fill="#3f4a52"/>
    <rect x="407" y="428" width="11" height="46" rx="5.5" fill="#3f4a52"/>
    <rect x="384" y="382" width="10" height="42" rx="5" fill="#a97c4f" transform="rotate(24 384 382)"/>
  </g>

  <!-- warga menonton -->
  <g opacity=".9">
    <circle cx="96" cy="398" r="15" fill="#c99a6b"/>
    <rect x="83" y="414" width="26" height="42" rx="9" fill="#356b48"/>
    <circle cx="132" cy="406" r="13" fill="#a97c4f"/>
    <rect x="121" y="420" width="23" height="36" rx="8" fill="#8a6d2b"/>
    <circle cx="486" cy="400" r="15" fill="#a97c4f"/>
    <rect x="473" y="416" width="26" height="40" rx="9" fill="#b0532e"/>
    <circle cx="522" cy="408" r="13" fill="#c99a6b"/>
    <rect x="511" y="422" width="23" height="34" rx="8" fill="#356b48"/>
  </g>

  <text x="586" y="586" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#0d3825" opacity=".33">ilustrasi</text>
</svg>
