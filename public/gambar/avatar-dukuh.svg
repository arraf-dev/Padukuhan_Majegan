<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Foto Dukuh Majegan">
  <title>Dukuh Majegan</title>

  <rect width="200" height="200" fill="#e6ede4"/>

  <!-- bahu -->
  <path d="M28 200 q0 -50 72 -50 q72 0 72 50 Z" fill="#0d3825"/>
  <!-- kerah beskap -->
  <path d="M100 150 l-20 12 l20 38 l20 -38 Z" fill="#f7f3e8"/>
  <path d="M100 150 l-20 12 l10 20 l10 -14 Z" fill="#d6b45c" opacity=".55"/>

  <!-- leher -->
  <rect x="87" y="122" width="26" height="34" rx="12" fill="#b9885a"/>
  <!-- wajah -->
  <circle cx="100" cy="98" r="38" fill="#c99a6b"/>
  <!-- blangkon -->
  <path d="M62 88 q6 -42 38 -42 q32 0 38 42 q-38 -18 -76 0 Z" fill="#2a4a34"/>
