<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Foto perangkat padukuhan">
  <title>Perangkat padukuhan</title>

  <rect width="200" height="200" fill="#f5ebd0"/>

  <!-- bahu -->
  <path d="M28 200 q0 -50 72 -50 q72 0 72 50 Z" fill="#2a5b3c"/>
  <path d="M100 150 l-18 11 l18 39 l18 -39 Z" fill="#f7f3e8"/>

  <!-- leher -->
  <rect x="87" y="122" width="26" height="34" rx="12" fill="#b9885a"/>
  <!-- wajah -->
  <circle cx="100" cy="98" r="38" fill="#c99a6b"/>
  <!-- rambut -->
  <path d="M62 96 q2 -46 38 -46 q36 0 38 46 q-6 -26 -38 -26 q-32 0 -38 26 Z" fill="#2f2418"/>

  <!-- mata & mulut -->
