<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Balai Dusun Majegan">
  <title>Balai Dusun Majegan</title>

  <rect width="800" height="600" fill="#f5ebd0"/>
  <circle cx="128" cy="104" r="40" fill="#d6b45c" opacity=".45"/>

  <!-- latar pepohonan -->
  <path d="M0 348 Q 160 296 330 340 Q 500 384 660 336 Q 740 314 800 330 L800 600 L0 600 Z" fill="#e6ede4"/>
  <g fill="#2a5b3c" opacity=".26">
