  <!-- pintu & jendela -->
  <rect x="366" y="366" width="68" height="90" rx="4" fill="#0d3825"/>
  <rect x="366" y="366" width="34" height="90" rx="4" fill="#ffffff" opacity=".07"/>
  <circle cx="392" cy="412" r="3.4" fill="#d6b45c"/>
  <circle cx="408" cy="412" r="3.4" fill="#d6b45c"/>
  <g fill="#2a5b3c" opacity=".82">
    <rect x="266" y="372" width="48" height="52" rx="4"/>
    <rect x="486" y="372" width="48" height="52" rx="4"/>
  </g>
  <g stroke="#f7f3e8" stroke-width="2.6" opacity=".85">
    <path d="M290 372 v52 M266 398 h48"/>
    <path d="M510 372 v52 M486 398 h48"/>
