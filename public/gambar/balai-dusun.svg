  <!-- atap joglo bertingkat -->
  <path d="M400 132 L648 268 L152 268 Z" fill="#0d3825"/>
  <path d="M400 132 L648 268 L400 268 Z" fill="#ffffff" opacity=".07"/>
  <rect x="142" y="264" width="516" height="15" rx="6" fill="#d6b45c"/>
  <path d="M400 208 L676 332 L124 332 Z" fill="#0a2e1e"/>
  <path d="M400 208 L676 332 L400 332 Z" fill="#ffffff" opacity=".05"/>
  <rect x="114" y="328" width="572" height="14" rx="6" fill="#d6b45c"/>

  <!-- mustaka -->
  <path d="M400 96 L414 132 L386 132 Z" fill="#d6b45c"/>
  <circle cx="400" cy="90" r="8" fill="#d6b45c"/>

  <!-- tangga -->
  <rect x="352" y="456" width="96" height="10" rx="3" fill="#cbc3a8"/>
  <rect x="340" y="466" width="120" height="10" rx="3" fill="#bdb49a"/>

  <!-- tiang bendera -->
  <rect x="676" y="352" width="5" height="104" rx="2" fill="#8a9a8c"/>
  <path d="M681 358 h56 v30 h-56 Z" fill="#b0532e"/>
  <path d="M681 373 h56 v15 h-56 Z" fill="#f7f3e8"/>

  <text x="784" y="586" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#0d3825" opacity=".33">ilustrasi</text>
