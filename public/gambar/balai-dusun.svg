    <circle cx="150" cy="336" r="34"/>
    <circle cx="694" cy="318" r="40"/>
    <circle cx="636" cy="338" r="30"/>
  </g>

  <!-- halaman -->
  <rect y="452" width="800" height="148" fill="#ebe6d8"/>
  <path d="M0 452 h800 v10 H0 Z" fill="#0d3825" opacity=".08"/>

  <!-- badan bangunan -->
  <rect x="196" y="330" width="408" height="126" fill="#f7f3e8"/>
  <rect x="196" y="330" width="408" height="126" fill="#0d3825" opacity=".04"/>

  <!-- soko guru (tiang joglo) -->
  <g fill="#6b5432">
    <rect x="226" y="330" width="17" height="126" rx="3"/>
    <rect x="330" y="330" width="17" height="126" rx="3"/>
    <rect x="453" y="330" width="17" height="126" rx="3"/>
    <rect x="557" y="330" width="17" height="126" rx="3"/>
  </g>
  <g fill="#0d3825" opacity=".18">
    <rect x="226" y="330" width="17" height="126" rx="3"/>
    <rect x="453" y="330" width="17" height="126" rx="3"/>
